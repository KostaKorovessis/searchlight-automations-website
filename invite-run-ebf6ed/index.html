<title>Smiths Falls Invite Run</title>

<style>
/* Layout: a field sheet for two drivers. Sticky route tabs, the next stop up top, then the map, then the stop list. */
:root {
  --bg: #F2F3EF; --surface: #FFFFFF; --ink: #14181C; --muted: #5C636A; --line: #D8DBD3; --chip: #E8EBE4;
  --k: #1747C4; --o: #B8246A; --go: #17744B; --warn: #A6510A; --bad: #B42318;
  --k-soft: #E3EAFB; --o-soft: #F8E4EE; --go-soft: #DDF1E6; --warn-soft: #FBEBD9;
  --display: "Barlow Condensed", "Arial Narrow", "Roboto Condensed", sans-serif;
  --body: "Barlow", "Segoe UI", system-ui, sans-serif;
  --mapfilter: none;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) { :root {
  --bg: #101315; --surface: #191D20; --ink: #ECEFEA; --muted: #9BA3A9; --line: #2B3135; --chip: #23292D;
  --k: #7EA2FF; --o: #F27AB2; --go: #4CC48E; --warn: #F2A654; --bad: #F47A6C;
  --k-soft: #1C2747; --o-soft: #3A1C2B; --go-soft: #17322A; --warn-soft: #3A2A17;
  --mapfilter: invert(.9) hue-rotate(180deg) saturate(.6) brightness(.95);
  color-scheme: dark; } }
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 15px; line-height: 1.4;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: env(safe-area-inset-top, 0px) calc(64px + env(safe-area-inset-bottom, 0px)); }
img { max-width: 100%; }
[hidden] { display: none !important; }
.wrap { max-width: 860px; margin: 0 auto; }
h1, h2, h3 { font-family: var(--display); text-wrap: balance; margin: 0; letter-spacing: .01em; }
h1 { font-size: 30px; line-height: 1; font-weight: 700; }
h2 { font-size: 24px; font-weight: 700; }
h3 { font-size: 19px; font-weight: 600; }
.num { font-variant-numeric: tabular-nums; }
a { color: inherit; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--k); outline-offset: 2px; border-radius: 6px; }

header.top { padding-block: 16px 10px; display: grid; gap: 6px; }
.eyebrow { font-family: var(--display); text-transform: uppercase; letter-spacing: .08em; font-size: 13px; color: var(--muted); font-weight: 600; }
.team { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 14px; color: var(--muted); }
.team b { color: var(--ink); font-size: 18px; font-family: var(--display); }
.bar { height: 8px; background: var(--chip); border-radius: 99px; overflow: hidden; position: relative; }
.bar i { position: absolute; inset: 0 auto 0 0; background: var(--go); border-radius: 99px; transition: width .3s; }
.bar .tick { position: absolute; top: -2px; bottom: -2px; width: 2px; background: var(--ink); opacity: .55; }
.sync { font-size: 12.5px; color: var(--muted); display: flex; align-items: center; gap: 6px; }
.sync i { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); display: inline-block; }
.sync.ok i { background: var(--go); } .sync.bad i { background: var(--warn); }

nav.tabs { position: sticky; top: 0; z-index: 5; background: var(--bg); display: flex; gap: 6px; padding-block: calc(8px + env(safe-area-inset-top, 0px)) 8px; margin-top: calc(-1 * env(safe-area-inset-top, 0px)); border-bottom: 1px solid var(--line); }
nav.tabs button { flex: 1 1 0; min-width: 0; border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 8px 6px; font-family: var(--display); font-weight: 600; font-size: 17px; cursor: pointer; line-height: 1.1; }
nav.tabs button small { display: block; font-family: var(--body); font-weight: 500; font-size: 12px; color: var(--muted); }
nav.tabs button[aria-selected="true"].k { background: var(--k); border-color: var(--k); color: #fff; }
nav.tabs button[aria-selected="true"].o { background: var(--o); border-color: var(--o); color: #fff; }
nav.tabs button[aria-selected="true"].p { background: var(--ink); border-color: var(--ink); color: var(--bg); }
nav.tabs button[aria-selected="true"] small { color: inherit; opacity: .85; }

.next { margin-top: 12px; background: var(--surface); border: 2px solid var(--k); border-radius: 14px; padding: 14px; display: grid; gap: 8px; }
.route-o .next { border-color: var(--o); }
.next h2 { font-size: 28px; line-height: 1.05; }
.next .meta { font-size: 14.5px; }
.next .ask { font-size: 15px; }
.actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 2px; }
.btn { flex: 1 1 auto; min-height: 50px; border-radius: 12px; border: 1px solid var(--line); background: var(--bg); font-family: var(--display); font-weight: 700; font-size: 19px; display: inline-flex; align-items: center; justify-content: center; padding: 0 14px; text-decoration: none; color: var(--ink); cursor: pointer; }
.btn.primary { flex-basis: 100%; background: var(--k); color: #fff; border-color: var(--k); }
.route-o .btn.primary { background: var(--o); border-color: var(--o); }
.btn.go { background: var(--go); color: #fff; border-color: var(--go); }
.then { font-size: 14px; color: var(--muted); border-top: 1px dashed var(--line); padding-top: 8px; }
.next.finished { border-color: var(--go); }

.summary { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; margin-block: 12px 10px; }
.summary div { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; min-width: 0; }
.summary span { display: block; font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }
.summary b { font-family: var(--display); font-size: 22px; font-weight: 700; }
@media (max-width: 520px) { .summary { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.pace { display: flex; align-items: center; gap: 8px; padding: 8px 12px; border-radius: 10px; background: var(--chip); font-weight: 500; margin-bottom: 10px; }
.pace.late { background: var(--warn-soft); color: var(--warn); }
.pace.good { background: var(--go-soft); color: var(--go); }

.mapbox { position: relative; height: min(58vh, 520px); min-height: 300px; border-radius: 12px; overflow: hidden; border: 1px solid var(--line); background: var(--chip); touch-action: none; user-select: none; -webkit-user-select: none; }
.mapbox .inner { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
.mapbox img { display: block; max-width: none; filter: var(--mapfilter); pointer-events: none; }
.mapbox svg { position: absolute; left: 0; top: 0; overflow: visible; }
.mapctl { position: absolute; right: 8px; top: 8px; display: grid; gap: 6px; z-index: 2; }
.mapctl button, .mapseg button { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; min-width: 40px; height: 40px; font-size: 18px; font-weight: 600; cursor: pointer; }
.mapseg { position: absolute; left: 8px; top: 8px; display: flex; z-index: 2; }
.mapseg button { font-size: 14px; padding: 0 10px; border-radius: 0; font-family: var(--display); }
.mapseg button:first-child { border-radius: 8px 0 0 8px; } .mapseg button:last-child { border-radius: 0 8px 8px 0; border-left: 0; }
.mapseg button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
.attrib { position: absolute; right: 6px; bottom: 4px; font-size: 10px; color: #333; background: rgba(255,255,255,.75); padding: 1px 5px; border-radius: 4px; z-index: 2; }
.legend { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 13px; color: var(--muted); margin-block: 6px 16px; }
.legend i { display: inline-block; width: 22px; height: 0; border-top: 4px solid; vertical-align: middle; margin-right: 5px; }
.legend i.walk { border-top-style: dotted; }

ol.stops { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.park { font-family: var(--display); font-weight: 600; font-size: 15px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); padding: 10px 2px 0; display: flex; gap: 8px; align-items: center; }
.park::after { content: ""; flex: 1; border-top: 1px dashed var(--line); }
.round { font-family: var(--display); font-weight: 700; font-size: 19px; padding: 16px 2px 2px; color: var(--ink); border-bottom: 2px solid var(--ink); }
li.stop { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px 10px 10px; display: grid; grid-template-columns: 44px minmax(0, 1fr); gap: 4px 10px; scroll-margin-top: 90px; }
li.stop.flash { box-shadow: 0 0 0 3px var(--k); }
.route-o li.stop.flash { box-shadow: 0 0 0 3px var(--o); }
li.stop.is-next { border: 2px solid var(--k); }
.route-o li.stop.is-next { border-color: var(--o); }
.check { grid-row: span 3; width: 44px; height: 44px; border-radius: 50%; border: 2.5px solid var(--line); background: var(--surface); display: grid; place-items: center; cursor: pointer; font-family: var(--display); font-weight: 700; font-size: 18px; color: var(--muted); }
.route-k .check { border-color: var(--k); color: var(--k); }
.route-o .check { border-color: var(--o); color: var(--o); }
li.stop.done .check, li.stop.staff .check { background: var(--go); border-color: var(--go); color: #fff; }
li.stop.closed .check, li.stop.skip .check { background: var(--chip); border-color: var(--muted); color: var(--muted); }
li.stop.done, li.stop.staff, li.stop.closed, li.stop.skip { background: color-mix(in srgb, var(--surface) 70%, var(--bg)); }
li.stop.done .nm, li.stop.staff .nm { text-decoration: line-through; text-decoration-thickness: 1.5px; color: var(--muted); }
.row1 { display: flex; gap: 8px; align-items: baseline; justify-content: space-between; min-width: 0; }
.nm { font-family: var(--display); font-size: 20px; font-weight: 600; line-height: 1.1; min-width: 0; }
.eta { font-family: var(--display); font-weight: 700; font-size: 18px; white-space: nowrap; }
.meta { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 13.5px; color: var(--muted); min-width: 0; }
.meta a { color: var(--ink); text-decoration-color: var(--line); text-underline-offset: 3px; }
.ask { font-size: 14px; min-width: 0; }
.tags { display: flex; flex-wrap: wrap; gap: 5px; grid-column: 2; }
.tag { font-size: 12px; font-weight: 600; padding: 2px 8px; border-radius: 99px; background: var(--chip); color: var(--muted); white-space: nowrap; }
.tag.big { background: var(--k-soft); color: var(--k); }
.route-o .tag.big { background: var(--o-soft); color: var(--o); }
.tag.warn { background: var(--warn-soft); color: var(--warn); }
.tag.drop { background: transparent; border: 1px dashed var(--muted); }
.tag.who { background: var(--go-soft); color: var(--go); }
.out { grid-column: 2; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-top: 4px; }
.out button.opt { border: 1px solid var(--line); background: var(--bg); border-radius: 99px; padding: 6px 11px; font-size: 13px; font-weight: 600; cursor: pointer; }
.out button.opt[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.copies { display: inline-flex; align-items: center; gap: 2px; border: 1px solid var(--line); border-radius: 99px; padding: 1px; background: var(--bg); }
.copies button { border: 0; background: transparent; width: 34px; height: 30px; font-size: 18px; cursor: pointer; }
.copies span { min-width: 58px; text-align: center; font-size: 13px; font-weight: 600; }
.note { flex: 1 1 160px; min-width: 0; border: 1px solid var(--line); border-radius: 8px; padding: 7px 8px; background: var(--bg); font: inherit; font-size: 16px; color: var(--ink); }
.extras { margin-top: 22px; display: grid; gap: 14px; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px; display: grid; gap: 8px; }
.panel ul, .panel ol { margin: 0; padding-left: 20px; display: grid; gap: 4px; }
.panel p { margin: 0; max-width: 68ch; }
.muted { color: var(--muted); font-size: 13.5px; }
table.mini { width: 100%; border-collapse: collapse; font-size: 13.5px; }
table.mini td, table.mini th { text-align: left; padding: 5px 6px; border-bottom: 1px solid var(--line); vertical-align: top; }
.scrollx { overflow-x: auto; }
.codebox { background: var(--warn-soft); border-radius: 12px; padding: 10px 12px; display: grid; gap: 8px; }
.coderow { display: flex; gap: 8px; }
.coderow input { flex: 1 1 auto; min-width: 0; font: inherit; font-size: 20px; letter-spacing: .15em; padding: 8px 10px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); }
.coderow .btn { flex: 0 0 auto; min-height: 46px; }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(14px + env(safe-area-inset-bottom, 0px)); background: var(--ink); color: var(--bg); padding: 10px 12px 10px 14px; border-radius: 12px; display: flex; gap: 12px; align-items: center; z-index: 20; width: max-content; max-width: calc(100% - 32px); font-weight: 500; box-shadow: 0 6px 24px rgba(0,0,0,.25); }
.toast button { background: transparent; border: 1.5px solid currentColor; color: inherit; border-radius: 8px; padding: 6px 12px; font-weight: 700; cursor: pointer; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; scroll-behavior: auto !important; } }
</style>
</head>

rphy & Kennedy (law)."},{"nm":"Hair Say","ad":"25 Main St W","hr":"9am–5pm","emp":4,"why":"Adds about 4 min. Go after Yvonne Lee Law Office."},{"nm":"C'est Tout Bakery & Bistro","ad":"20 Beckwith St N","hr":"8:30am–3pm","emp":10,"why":"Adds about 5 min. Go after Kirkland Murphy & Kennedy (law)."},{"nm":"Lannin Funeral Home","ad":"32 Main St E","hr":"9am–5pm","emp":6,"why":"Adds about 5 min. Go after Kirkland Murphy & Kennedy (law)."}],"dropMin":34}],"plan":[{"h":"How the day runs","html":"<ul>\n<li>You both leave Mark's at 9:00. Kosta drives the blue route. The Ops Manager drives the pink route. The two routes do not share a stop.</li>\n<li>Each route goes in four rounds, biggest first. Round 1 is the big employers (90 or more staff, plus the town police). Round 2 is 40 to 89 staff. Round 3 is 15 to 39. Round 4 is under 15.</li>\n<li>A small place right next door to a bigger one gets its visit while you are parked there. That saves a trip back later.</li>\n<li>The card at the top always shows your next stop. Tap “Drive there” for directions. Tap “Done” when you finish.</li>\n<li>Each tick shows on both phones within about 10 seconds. If you lose signal, the phone keeps the tick and sends it later.</li>\n<li>Each planned time includes the drive, parking, the walk in, the talk, and the walk back to the car.</li>\n</ul>"},{"h":"At each stop","html":"<ul>\n<li>At a big employer, ask for HR or the office manager.</li>\n<li>Leave enough copies for the staff, plus one for the staff board. The stop card shows a suggested count.</li>\n<li>If the manager is out, give the copies to the person in charge. Then mark the stop “Left with staff”.</li>\n<li>If a door is locked, mark the stop “Closed / no one” and go on.</li>\n</ul>"},{"h":"Before you leave Mark's","html":"<ul>\n<li>Count out the “Bring” number on your route tab. It is the plan's copy count plus 15% spare.</li>\n<li>Put the copies in a folder, so they stay dry and flat.</li>\n<li>Charge your phone and bring a car charger. Open this page on your route tab.</li>\n</ul>"},{"h":"Timing rules in the plan","html":"<ul>\n<li>Restaurants and coffee shops: not from 11:30 to 1:30. That is the lunch rush.</li>\n<li>Tim Hortons: not before 9:30 either. That is the morning rush.</li>\n<li>Schools: go to the main office during class time, and sign in. Not at bell times.</li>\n<li>Banks and most downtown shops open between 9:00 and 10:00.</li>\n<li>Some small places have hours that nobody confirmed. They show “not confirmed”.</li>\n</ul>"},{"h":"Places left out, and why","html":"<ul>\n<li>Mark's: your own store.</li>\n<li>Closed for good: Peavey Mart (231 Lombard St), the Metroland flyer centre, Harvest Social (now SIP Bistro) and Barb's Diner. The old Hershey building at 1 Hershey Dr is empty.</li>\n<li>Closed on Wednesday: DriveTest and The Tap Room. Bowie's and Man Ling open too late in the day.</li>\n<li>Not in Smiths Falls: Frulact (Kingston), Cavanagh Construction (Ashton) and Rocky River Cafe (Perth). Campbell's Trucking is on Hwy 15, north of town.</li>\n<li>Not found anywhere: Stinson, Horizon, JPB, On Track, Drummond Building Supplies, Adrenaline Apparel and Mary Brown's.</li>\n<li>Covered by another stop: the fire hall, Public Works and the water plants get their copies at Town Hall.</li>\n<li>Name fixes: “Wills Independent” is Your Independent Grocer. “Rideau Credit Union” is the credit union at 1 Beckwith St N. “Valley Butcher” is Valley Custom Cutting. “Tap House” is Lockmaster's Taphouse. “Cetoot Bakery” is C'est Tout.</li>\n</ul>"},{"h":"How the routes were built","html":"<p>The places come from OpenStreetMap, checked against web listings on October 27. The staff counts are estimates, because few businesses publish them. The OPP East Region HQ count (about 200) comes from your own note.</p>\n<p>Drive times come from the OSRM road router, plus 20% for lights and turns. Each drive adds 2.5 minutes to park and walk to the door. Each stop gets 3 to 13 minutes at the door, by its size.</p>\n<p>A solver tried thousands of versions of the two routes. It kept the version that reaches the most staff, with at least 70 businesses, inside about 5 hours each, in the four rounds above.</p>"}]};

function paceHTML(route) {
  const now = new Date(); const ymd = now.getFullYear() + "-" + String(now.getMonth() + 1).padStart(2, "0") + "-" + String(now.getDate()).padStart(2, "0");
  if (ymd !== DATA.day) return `<div class="pace">Plan for ${esc(DATA.dayLabel)}. Leave Mark's at ${route.leave}. Back by ${route.back}.</div>`;
  const next = route.stops.find(s => !state[s.id]);
  if (!next) return "";
  const mins = now.getHours() * 60 + now.getMinutes(); const d = Math.round(mins - next.tm);

}
function stopHTML(route, s, nextId) {
  const st = state[s.id] || null; const cls = (st ? st.s : "") + (s.id === nextId ? " is-next" : "");
  const tags = [];
  if (s.emp >= 60) tags.push(`<span class="tag big">big employer</span>`);
  if (s.av) tags.push(`<span class="tag warn">Avoid ${esc(s.av)}</span>`);
  if (s.drop) tags.push(`<span class="tag drop">drop if late</span>`);
  if (s.pk) tags.push(`<span class="tag">next door: do it while parked</span>`);
  if (s.md === "walk") tags.push(`<span class="tag">walk ${Math.max(1, Math.round(s.lg))} min</span>`);
  if (st && st.by && st.by !== route.key) tags.push(`<span class="tag who">done by ${esc(WHO[st.by] || st.by)}</span>`);
  const c = st?.c ?? s.cp;
  return `<li class="stop ${cls}" id="stop-${s.id}">
    <button class="check" data-act="toggle" data-id="${s.id}" aria-label="Mark ${esc(s.nm)} done" aria-pressed="${!!st}">${st ? (isDone(s.id) ? "✓" : "–") : s.n}</button>
    <div class="row1"><div class="nm">${esc(s.nm)}</div><div class="eta num">${s.t}</div></div>
    <div class="meta"><a href="${navUrl(s)}" target="_blank" rel="noopener">${esc(s.ad)} ↗</a><span>Wed ${esc(s.hr)}</span><span>~${s.emp} staff</span><span>Leave ${s.cp}</span></div>
    <div class="ask">${esc(s.ask)}${s.nt ? ` <span class="muted">${esc(s.nt)}</span>` : ""}</div>
    ${tags.length ? `<div class="tags">${tags.join("")}</div>` : ""}
    ${st ? `<div class="out">${STATUS.map(([k, l]) => `<button class="opt" data-act="status" data-id="${s.id}" data-v="${k}" aria-pressed="${st.s === k}">${l}</button>`).join("")}
      <span class="copies"><button data-act="cminus" data-id="${s.id}" aria-label="Fewer copies">−</button><span class="num">${c} copies</span><button data-act="cplus" data-id="${s.id}" aria-label="More copies">+</button></span>
      <input class="note" id="note-${s.id}" data-id="${s.id}" placeholder="Note (for example: come back Thursday)" value="${esc(st.note || "")}"></div>` : ""}
  </li>`;
}
const ROUNDS = ["Round 1 · big employers (90+ staff)", "Round 2 · mid-size places (40 to 89 staff)", "Round 3 · smaller places (15 to 39 staff)", "Round 4 · small places (under 15 staff)"];
function roundOf(route, idx) { // the round a stop belongs to: the last non-pickup stop at or before it
  for (let k = idx; k >= 0; k--) if (!route.stops[k].pk) return route.stops[k].tier;
  return 0;
}
function listHTML(route) {
  const nextId = route.stops.find(s => !state[s.id])?.id;
  let list = "", prevMode = null, round = -1;
  route.stops.forEach((s, i) => {
    const rd = roundOf(route, i);
    if (rd !== round) { list += `<li class="round">${ROUNDS[rd] || ""}</li>`; round = rd; }
    const nextWalks = route.stops[i + 1]?.md === "walk";
    if (s.md === "drive" && nextWalks) {
      let k = i + 1; while (route.stops[k]?.md === "walk") k++;
      list += `<li class="park">Park once · walk the next ${k - i - 1} stop${k - i - 1 > 1 ? "s" : ""}</li>`;
    } else if (s.md === "drive" && prevMode === "walk") list += `<li class="park">Back to the car</li>`;
    list += stopHTML(route, s, nextId); prevMode = s.md;
  });
  return list + `<li class="park">Back to Mark's by ${route.back}</li>`;
}
function routeHTML(route) {
  const done = route.stops.filter(s => isDone(s.id));
  const extras = route.extras.map(x => `<tr><td><b>${esc(x.nm)}</b><br><span class="muted">${esc(x.ad)}</span></td><td class="num">~${x.emp}</td><td>${esc(x.hr)}</td><td class="muted">${esc(x.why)}</td></tr>`).join("");
  return `<div id="nextwrap">${nextHTML(route)}</div>
    <div class="summary">
      <div><span>Leave Mark's</span><b class="num">${route.leave}</b></div>
      <div><span>Back</span><b class="num">${route.back}</b></div>
      <div><span>Done</span><b class="num" id="donecount">${done.length}/${route.stops.length}</b></div>
      <div><span>Bring</span><b class="num">${route.bring}</b> <span style="display:inline;text-transform:none">copies</span></div>
    </div>
    <div id="pacewrap">${paceHTML(route)}</div>
    ${mapHTML()}
    <h2 style="margin-bottom:6px">All stops, biggest first</h2>
    <p class="muted" style="margin:0 0 10px">Tap a circle to mark a stop done. Tap an address for directions. Times are planned arrivals. ${esc(route.impact)}</p>
    <ol class="stops" id="stoplist">${listHTML(route)}</ol>
    <div class="extras">
      <div class="panel"><h3>If you're ahead: extra stops near this route</h3><div class="scrollx"><table class="mini"><tr><th>Business</th><th>Staff</th><th>Wed</th><th>Why</th></tr>${extras}</table></div></div>
      <div class="panel"><h3>If you're behind</h3><p>Skip the stops marked “drop if late” first. They give the fewest staff for the minutes they take. Never skip a stop marked “big employer”.</p></div>
    </div>`;
}
function planHTML() {
  return `<div class="extras" style="margin-top:14px">${DATA.plan.map(sec => `<div class="panel"><h3>${esc(sec.h)}</h3>${sec.html}</div>`).join("")}</div>`;
}
function render() {
  renderTeam(); renderTabs();
  const v = $("#view");
  if (current === "plan") { v.className = ""; v.innerHTML = planHTML(); return; }
  const route = DATA.routes.find(r => r.key === current);
  v.className = "route-" + route.cls; v.innerHTML = routeHTML(route); setupMap(route);
}
function refresh() {
  renderTeam(); renderTabs();
  if (current === "plan") return;
  const route = DATA.routes.find(r => r.key === current);
  const active = document.activeElement;
  const typing = active && active.classList.contains("note");
  $("#nextwrap").innerHTML = nextHTML(route);
  $("#pacewrap").innerHTML = paceHTML(route);
  $("#donecount").textContent = route.stops.filter(s => isDone(s.id)).length + "/" + route.stops.length;
  if (!typing) {
    const y = window.scrollY;
    $("#stoplist").innerHTML = listHTML(route);
    window.scrollTo({ top: y });
  }
  mapState?.redraw?.();
}

/* ---------- shared list ---------- */
function setSync(kind, text) { const el = $("#sync"); el.className = "sync " + kind; el.querySelector("span").textContent = text; }
function syncLabel() {
  const n = Object.keys(pending).length;
  const t = new Date().toLocaleTimeString([], { hour: "numeric", minute: "2-digit" });
  return n ? `${n} change${n > 1 ? "s" : ""} waiting to send` : `Shared list up to date · ${t}`;
}
function askCode(hint) {
  $("#codebox").hidden = false;
  if (hint) $("#codehint").textContent = hint;
  setSync("bad", "Ticks save on this phone until you type the team code.");
}
$("#codebox").addEventListener("submit", e => {
  e.preventDefault();
  const v = $("#codein").value.trim(); if (!v) return;
  RUN_KEY = v; try { localStorage.setItem(LS_CODE, v); } catch (err) {}
  $("#codebox").hidden = true; flush().then(pull);
});
function badCode() {
  RUN_KEY = ""; try { localStorage.removeItem(LS_CODE); } catch (err) {}
  askCode("That code did not work. Check it and type it again.");
}
async function pull() {
  if (!RUN_KEY) { askCode(); return; }
  try {
    const r = await fetch(API, { headers: { "x-run-key": RUN_KEY }, cache: "no-store" });
    if (r.status === 403) { badCode(); return; }
    if (!r.ok) throw new Error(r.status);
    const j = await r.json();
    const next = { ...j.visits };
    for (const id in pending) { if (pending[id] === null) delete next[id]; else next[id] = pending[id]; }
    const changed = JSON.stringify(next) !== JSON.stringify(state);
    state = next; saveLocal();
    setSync(Object.keys(pending).length ? "bad" : "ok", syncLabel());
    if (changed) refresh();
  } catch (e) { setSync("bad", "Offline. Ticks save on this phone and send when the signal comes back."); }
}
async function push(id) {
  const v = Object.prototype.hasOwnProperty.call(state, id) ? state[id] : null;
  pending[id] = v; saveLocal();
  if (!RUN_KEY) { askCode(); return; }
  try {
    const r = await fetch(API, { method: "POST", headers: { "content-type": "application/json", "x-run-key": RUN_KEY }, body: JSON.stringify({ id, v }) });
    if (r.status === 403) { badCode(); return; }
    if (!r.ok) throw new Error(r.status);
    const j = await r.json();
    if (pending[id] === v) { delete pending[id]; if (j.v) state[id] = j.v; }
    saveLocal(); setSync(Object.keys(pending).length ? "bad" : "ok", syncLabel());
  } catch (e) { setSync("bad", "Offline. Ticks save on this phone and send when the signal comes back."); }
}
async function flush() { if (!RUN_KEY) return; for (const id of Object.keys(pending)) await push(id); }
function change(id, value) {
  if (value === null) delete state[id]; else state[id] = value;
  saveLocal(); refresh(); push(id);
}
function me() { return ROUTE_KEYS.includes(current) ? current : ""; }

/* ---------- actions ---------- */
let undoTimer = null;
function toast(msg, undo) {
  const t = $("#toast"); $("#toastmsg").textContent = msg; t.hidden = false;
  $("#toastundo").onclick = () => { t.hidden = true; undo(); };
  clearTimeout(undoTimer); undoTimer = setTimeout(() => { t.hidden = true; }, 7000);
}
const noteTimers = {};
document.addEventListener("click", e => {
  const b = e.target.closest("[data-act]"); if (!b) return;
  const id = b.dataset.id, s = byId[id].s, act = b.dataset.act;
  const prev = state[id] ? { ...state[id] } : null;
  const base = () => ({ s: "done", c: s.cp, note: "", by: me() });
  if (act === "nextdone") { change(id, base()); window.scrollTo({ top: 0, behavior: "smooth" }); toast(`Done: ${s.nm}`, () => change(id, prev)); return; }
  if (act === "nextskip") { change(id, { ...base(), s: "skip" }); window.scrollTo({ top: 0, behavior: "smooth" }); toast(`Skipped: ${s.nm}`, () => change(id, prev)); return; }
  if (act === "toggle") { if (state[id]) { change(id, null); toast(`Unticked: ${s.nm}`, () => change(id, prev)); } else change(id, base()); return; }
  if (!state[id]) return;
  if (act === "status") change(id, { ...state[id], s: b.dataset.v });
  if (act === "cminus") change(id, { ...state[id], c: Math.max(0, (state[id].c ?? s.cp) - 1) });
  if (act === "cplus") change(id, { ...state[id], c: (state[id].c ?? s.cp) + 1 });
});
document.addEventListener("input", e => {
  if (!e.target.classList.contains("note")) return; const id = e.target.dataset.id; if (!state[id]) return;
  state[id] = { ...state[id], note: e.target.value.slice(0, 300) }; saveLocal();
  clearTimeout(noteTimers[id]); noteTimers[id] = setTimeout(() => push(id), 900);
});
document.addEventListener("focusout", e => { if (e.target.classList?.contains("note")) setTimeout(refresh, 50); });

render();
flush().then(pull);
setInterval(() => { if (document.visibilityState === "visible") flush().then(pull); }, 8000);
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") flush().then(pull); });
setInterval(() => { if (current !== "plan" && $("#pacewrap")) $("#pacewrap").innerHTML = paceHTML(DATA.routes.find(r => r.key === current)); }, 60000);
</script>
</body>
</html>
